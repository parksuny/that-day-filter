server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/that_day_filter?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: filter_user
    password: filter
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

file:
  upload-dir: uploads